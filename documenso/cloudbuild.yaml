steps:
  # Uploads from Windows lose the executable bit: restore it on the files git marks executable
  - name: bash
    args: ['-c', 'xargs chmod +x < .exec-files']
  - name: gcr.io/cloud-builders/docker
    # BuildKit, as Documenso's own builds use (the old builder makes WORKDIR /app root-owned and npm ci fails)
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'docker/Dockerfile', '-t', 'us-central1-docker.pkg.dev/my-homes-documenso/documenso/documenso:v2.21.1-frame', '.']
images: ['us-central1-docker.pkg.dev/my-homes-documenso/documenso/documenso:v2.21.1-frame']
options:
  machineType: E2_HIGHCPU_8
timeout: 5400s
