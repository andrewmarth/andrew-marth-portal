steps:
  # Uploads from Windows lose the executable bit: restore it on the files git marks executable
  - name: bash
    args: ['-c', 'xargs chmod +x < .exec-files']
  # The app's name, MarthSign, in its text (marthsign-rebrand.sh comes with the patch)
  - name: bash
    args: ['-c', 'bash marthsign-rebrand.sh']
  - name: gcr.io/cloud-builders/docker
    # BuildKit, as the upstream builds use (the old builder makes WORKDIR /app root-owned and npm ci fails)
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'docker/Dockerfile', '-t', 'us-central1-docker.pkg.dev/my-homes-documenso/marthsign/marthsign:v2.21.1', '.']
images: ['us-central1-docker.pkg.dev/my-homes-documenso/marthsign/marthsign:v2.21.1']
options:
  machineType: E2_HIGHCPU_8
timeout: 5400s
