<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Links | Andrew Marth Real Estate</title>
    
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Familjen+Grotesk:wght@400..700&display=swap" rel="stylesheet">
    
    <style>
        /* --- General Reset & Styling --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        /* Prevents ALL horizontal scrolling across all mobile browsers */
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            position: relative;
        }
        
        body {
            font-family: 'Familjen Grotesk', sans-serif; 
            line-height: 1.6;
            color: #4f2d2c; 
            background-color: #e9e2d8; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Updated Header Font */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Bricolage Grotesque', sans-serif;
        }
        
        /* --- Navigation Bar (Fixed & Glassmorphism) --- */
        .navbar {
            background: rgba(233, 226, 216, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000; 
            padding: 15px 30px;
            display: flex; align-items: center;
            border-bottom: 1px solid rgba(153, 114, 75, 0.3); 
            min-height: 80px;
        }
        .mobile-center-logo { display: none; }
        .hamburger { display: none; font-size: 2rem; background: none; border: none; color: #4e513e; cursor: pointer; }
        .nav-menu { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .nav-logo img { height: 50px; width: auto; display: block; border-radius: 4px; }
        .nav-logo a { text-decoration: none; display: block; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-links a { text-decoration: none; color: #4f2d2c; font-weight: bold; font-size: 1.1rem; transition: color 0.3s; }
        .nav-links a:hover { color: #9a5d40; }
        .close-menu { display: none; }

        /* --- Header / Hero Section (Video Background) --- */
        header {
            position: relative;
            padding: 160px 20px 100px 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            min-height: 45vh;
            text-align: center;
        }
        
        .hero-video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
        }
        
        .hero-color-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(78, 81, 62, 0.75); 
            z-index: 1;
        }
        
        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header h1 {
            color: #e9e2d8;
            font-size: 4.5rem; 
            margin-bottom: 0px; 
            line-height: 1.1; 
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3); 
        }

        /* --- Main Links Section --- */
        main {
            flex-grow: 1; /* Pushes footer to the bottom of the screen */
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-card {
            background-color: #ffffff;
            border-radius: 20px;
            border: 2px solid #0E2A3B;
            box-shadow: 6px 6px 0px #0E2A3B;
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .card-body {
            padding: 20px 40px;
        }

        /* --- Dynamic List Items --- */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 0;
            border-bottom: 1px solid #e0d5c9;
            gap: 20px;
        }
        
        .link-item:last-child {
            border-bottom: none;
        }

        .link-info {
            flex-grow: 1;
        }

        .link-info h3 {
            font-size: 1.3rem;
            color: #4e513e;
            margin-bottom: 4px;
        }

        .link-info p {
            font-size: 1.05rem;
            color: #4f2d2c;
            opacity: 0.85;
            margin: 0;
            line-height: 1.4;
        }

        /* Loading State */
        .loading-text {
            text-align: center;
            padding: 40px;
            color: #99724b;
            font-weight: bold;
            font-size: 1.2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* --- Button Styling --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px; 
            background-color: #99724b; 
            color: #e9e2d8; 
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 999px; 
            font-weight: bold;
            font-size: 1.05rem;
            border: 2px solid #0E2A3B;
            box-shadow: 0 4px 10px rgba(153, 114, 75, 0.2);
            transition: all 0.3s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover {
            background-color: #9a5d40; 
            transform: translateY(-3px); 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
        }
        .btn .btn-icon {
            width: 16px; 
            height: 16px;
            object-fit: contain;
            transition: transform 0.3s ease;
            border: none;
        }
        .btn:hover .btn-icon {
            transform: translateX(4px); 
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            background-color: #4e513e; 
            color: #e9e2d8; 
            width: 100%;
        }
        .footer-contact { margin-bottom: 20px; }
        .footer-contact p { margin-bottom: 8px; font-size: 1.1rem; color: #e9e2d8; }
        .footer-contact a { color: #c09050; text-decoration: none; font-weight: bold; }
        .footer-contact a:hover { text-decoration: underline; }
        .footer-disclosure { max-width: 900px; margin: 0 auto; font-size: 0.8rem; color: #e9e2d8; opacity: 0.75; line-height: 1.5; text-align: justify; text-align-last: center; }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .navbar { justify-content: flex-end; }
            .mobile-center-logo { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
            .mobile-center-logo img { height: 40px; width: auto; border-radius: 4px; display: block; }
            .hamburger { display: block; }
            .nav-menu { position: fixed; top: 0; right: -100%; width: 280px; height: 100vh; background: rgba(233, 226, 216, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 60px 30px 30px 30px; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease; z-index: 1001; }
            .nav-menu.active { right: 0; }
            .nav-logo { margin-bottom: 40px; width: 100%; display: flex; justify-content: center; }
            .nav-logo img { height: 60px; }
            .nav-links { flex-direction: column; width: 100%; align-items: flex-start; gap: 20px; }
            .nav-links a { display: block; width: 100%; padding-bottom: 10px; border-bottom: 1px solid rgba(192, 144, 80, 0.4); font-size: 1.3rem; }
            .close-menu { display: block; position: absolute; top: 15px; right: 25px; font-size: 2.5rem; background: none; border: none; color: #4f2d2c; cursor: pointer; line-height: 1; }
            
            header h1 { font-size: 3rem; }
            
            main { padding: 40px 15px; }
            .card-body { padding: 10px 20px 20px 20px; }
            
            .link-item {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                gap: 15px;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <header>
        <video class="hero-video-bg" autoplay loop muted playsinline>
            <source src="https://andrewmarth.com/images/banner.mp4" type="video/mp4">
        </video>
        <div class="hero-color-overlay"></div>
        <div class="hero-content">
            <h1>Backend Links</h1>
        </div>
    </header>

    <!-- Main Card Container -->
    <main>
        <div class="main-card">
            <div class="card-body" id="links-container">
                <!-- Loading Indicator -->
                <div class="loading-text">Loading secure links...</div>
            </div>
        </div>
    </main>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <script>
        // Universal Component Loader for Navbar & Footer
        async function loadComponent(id, file) {
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const html = await response.text();
                document.getElementById(id).innerHTML = html;
                
                if (id === 'header-placeholder') {
                    initNavigation();
                }
            } catch (error) {
                console.error(`Error loading component ${file}:`, error);
            }
        }

        // Mobile Nav Logic
        function initNavigation() {
            const hamburgerBtn = document.getElementById('hamburger-btn');
            const closeBtn = document.getElementById('close-btn');
            const navMenu = document.getElementById('nav-menu');

            if(hamburgerBtn && closeBtn && navMenu) {
                hamburgerBtn.addEventListener('click', () => navMenu.classList.add('active'));
                closeBtn.addEventListener('click', () => navMenu.classList.remove('active'));
            }
        }

        // Google Sheet Fetch Logic
        async function loadGoogleSheetLinks() {
            const sheetId = '1HEsow_T7N-0kAy6Ax9jo5cE4KM7X08l2C-Cu9qwEfPw';
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=0`;
            const container = document.getElementById('links-container');
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);
                
                container.innerHTML = '';
                
                data.table.rows.forEach((row, index) => {
                    if (!row || !row.c || !row.c[0] || !row.c[0].v) return;
                    
                    const title = row.c[0] ? row.c[0].v : '';
                    const desc = row.c[1] && row.c[1].v ? row.c[1].v : '';
                    const link = row.c[2] && row.c[2].v ? row.c[2].v : '#';
                    
                    if (index === 0 && title.toLowerCase() === 'title') return;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'link-item';
                    
                    itemDiv.innerHTML = `
                        <div class="link-info">
                            <h3>${title}</h3>
                            ${desc ? `<p>${desc}</p>` : ''}
                        </div>
                        <a href="${link}" class="btn" target="_blank" rel="noopener noreferrer">
                            Launch
                            <img src="https://andrewmarth.com/images/arrow_forward.png" alt="Launch" class="btn-icon">
                        </a>
                    `;
                    
                    container.appendChild(itemDiv);
                });
                
            } catch (error) {
                console.error('Error fetching sheet data:', error);
                container.innerHTML = '<div class="loading-text" style="color: #d9534f; animation: none;">Failed to load links. Please try refreshing the page.</div>';
            }
        }

        // Execute when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-placeholder', 'header.html');
            loadComponent('footer-placeholder', 'footer.html');
            loadGoogleSheetLinks();
        });
    </script>
</body>
</html>
