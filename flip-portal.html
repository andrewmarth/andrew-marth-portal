<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- A fullscreen map: pinching zooms the map, never the page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flip Portal | Andrew Marth Client Portal</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4e513e">
    <!-- Installable app: manifest, icons, iPhone home-screen settings and the service worker -->
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Homes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Familjen+Grotesk:wght@400..700&display=swap" rel="stylesheet">

    <style>
        /* --- Brand Palette (same as andrewmarth.com) --- */
        :root {
            --cream: #e9e2d8;
            --brown: #4f2d2c;
            --olive: #4e513e;
            --tan: #99724b;
            --rust: #9a5d40;
            --gold: #c09050;
            --navy: #0E2A3B;
            --white: #ffffff;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { position: relative; background-color: var(--cream); }
        html::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url('https://andrewmarth.com/images/tiling_background_alt.png');
            background-size: 420px;
            mix-blend-mode: multiply;
            opacity: 0.07;
        }
        body {
            position: relative;
            z-index: 1;
            font-family: 'Familjen Grotesk', sans-serif;
            line-height: 1.6;
            color: var(--brown);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hidden until we know who is signed in and the sheets have loaded (only the loading screen shows) */
        body.is-checking > *:not(.page-loader) { visibility: hidden; }
        /* No scrolling (or pull-to-refresh bounce) while the loading screen is up */
        html:has(body.is-checking), body.is-checking { overflow: hidden; overscroll-behavior: none; }
        .page-loader { touch-action: none; }
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: var(--cream);
            color: var(--brown);
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        body:not(.is-checking) .page-loader { opacity: 0; visibility: hidden; pointer-events: none; }
        /* Morphing icon (loader.js): sits on the background and pops with a twist each time it changes */
        .loader-badge {
            width: 120px;
            height: 120px;
            margin-bottom: 14px;
            color: var(--brown);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-icon { width: 92px; height: 92px; overflow: visible; }
        .loader-badge.is-morphing .loader-icon { animation: iconMorph 0.65s cubic-bezier(0.34, 1.4, 0.64, 1); }
        @keyframes iconMorph {
            0% { transform: rotate(0deg) scale(1); }
            40% { transform: rotate(-12deg) scale(0.84); }
            75% { transform: rotate(4deg) scale(1.08); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .page-loader-text {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            opacity: 0.85;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .page-loader-text.is-leaving { opacity: 0; transform: translateY(-8px); }
        .page-loader-text.is-entering { animation: phraseIn 0.35s cubic-bezier(0.2, 0.8, 0.3, 1); }
        @keyframes phraseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.85; transform: none; } }
        /* Loading bar: a gold segment that sweeps across the track, over and over */
        .loader-bar {
            position: relative;
            width: 180px;
            height: 6px;
            margin-top: 16px;
            border-radius: 999px;
            background: rgba(78, 81, 62, 0.15);
            overflow: hidden;
        }
        .loader-bar::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--gold), var(--rust));
            animation: loaderBar 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes loaderBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .loader-bar::before { animation-duration: 3s; }
            .loader-badge.is-morphing .loader-icon, .page-loader-text.is-entering { animation: none; }
        }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
        h1, h2, h3 { font-family: 'Bricolage Grotesque', sans-serif; }
        a:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

        /* --- Header --- */
        header {
            position: relative;
            overflow: hidden;
            background-color: var(--olive);
            color: var(--cream);
            text-align: center;
            padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 110px 20px;
        }
        .hero-video-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
        .hero-color-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at center, rgba(78, 81, 62, 0.55) 0%, rgba(78, 81, 62, 0.85) 75%),
                linear-gradient(180deg, rgba(14, 42, 59, 0.3) 0%, rgba(78, 81, 62, 0.35) 55%, rgba(79, 45, 44, 0.75) 100%);
        }
        .top-bar {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto 44px auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .top-bar img { height: 34px; width: auto; display: block; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35)); }
        .top-actions { display: flex; align-items: center; gap: 10px; }
        .sign-out {
            display: inline-flex;
            justify-content: center;
            text-decoration: none;
            white-space: nowrap;
            align-items: center;
            gap: 8px;
            min-height: 40px;
            padding: 8px 18px;
            border: 2px solid rgba(233, 226, 216, 0.7);
            border-radius: 999px;
            background: rgba(14, 42, 59, 0.25);
            color: var(--cream);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }
        .sign-out svg { width: 16px; height: 16px; }
        /* Round gear-only button */
        .sign-out.icon-only { width: 40px; padding: 0; }
        .sign-out.icon-only svg { width: 19px; height: 19px; transition: transform 0.5s var(--ease); }
        @media (hover: hover) { .sign-out.icon-only:hover svg { transform: rotate(60deg); } }
        @media (hover: hover) { .sign-out:hover { background: var(--rust); border-color: var(--rust); } }

        .hero-content { position: relative; z-index: 2; }
        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .hero-eyebrow::before, .hero-eyebrow::after { content: ''; width: 24px; height: 2px; background: currentColor; }
        header h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.05; text-shadow: 0 2px 12px rgba(0,0,0,0.3); }
        .hero-sub { margin-top: 10px; font-size: 1.05rem; opacity: 0.9; }

        /* --- Main cards --- */
        main {
            position: relative;
            z-index: 3;
            flex: 1;
            width: 100%;
            max-width: 760px;
            margin: -70px auto 0 auto;
            padding: 0 20px 60px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .main-card {
            background: var(--white);
            border: 2px solid var(--navy);
            border-radius: 24px;
            box-shadow: 6px 6px 0px var(--navy);
            padding: 30px 30px 26px 30px;
            width: calc(100% - 6px);
        }
        .card-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--rust);
            margin-bottom: 6px;
        }
        .card-eyebrow::before { content: ''; width: 18px; height: 2px; background: currentColor; }
        .main-card h2 { font-size: 1.7rem; line-height: 1.15; margin-bottom: 14px; }

        .id-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            background: #f7f4f0;
            border: 1px solid rgba(78, 81, 62, 0.15);
        }
        .id-icon {
            flex: 0 0 auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--olive);
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .id-icon svg { width: 22px; height: 22px; }
        .id-label { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; }
        .id-value { font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.3rem; font-weight: 700; }

        /* Details from the Google Sheet */
        .details { list-style: none; }
        .details li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            padding: 13px 2px;
            border-bottom: 1px solid rgba(78, 81, 62, 0.15);
        }
        .details li:last-child { border-bottom: none; }
        .details .k { font-weight: bold; opacity: 0.75; flex: 0 0 auto; }
        .details .v { text-align: right; overflow-wrap: anywhere; }
        .details .v a { color: var(--tan); font-weight: bold; }

        .status-text { text-align: center; font-style: italic; opacity: 0.75; padding: 14px 0; }
        .status-text.is-error { color: var(--rust); font-style: normal; font-weight: bold; opacity: 1; }
        .spinner {
            display: block;
            width: 30px;
            height: 30px;
            margin: 6px auto 10px auto;
            border-radius: 50%;
            border: 3px solid rgba(78, 81, 62, 0.2);
            border-top-color: var(--olive);
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .placeholder-note {
            padding: 16px 18px;
            border-radius: 16px;
            background: #fdf6e9;
            border: 1px dashed rgba(192, 144, 80, 0.7);
        }

        /* Brown "Ready When You Are" style contact card */
        .contact-card { background: var(--brown); color: var(--cream); text-align: center; }
        .contact-card .card-eyebrow { color: var(--gold); }
        .contact-card .card-eyebrow::after { content: ''; width: 18px; height: 2px; background: currentColor; }
        .contact-card h2 { color: var(--cream); margin-bottom: 6px; }
        .contact-card p { opacity: 0.88; margin-bottom: 18px; }
        .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 26px;
            border: 2px solid var(--navy);
            border-radius: 999px;
            background-color: var(--tan);
            color: var(--cream);
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.25s ease, transform 0.25s ease;
        }
        @media (hover: hover) { .btn:hover { background-color: var(--rust); transform: translateY(-3px); } }

        /* --- Scroll Reveal --- */
        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
        .reveal.is-visible { opacity: 1; transform: none; }

        footer {
            position: relative;
            z-index: 2;
            background-color: var(--olive);
            color: var(--cream);
            text-align: center;
            padding: 28px 20px calc(env(safe-area-inset-bottom, 0px) + 28px) 20px;
            font-size: 0.85rem;
        }
        footer a { color: var(--cream); }
        .footer-disclosure { max-width: 760px; margin: 12px auto 0 auto; font-size: 0.72rem; opacity: 0.7; line-height: 1.5; }

        @media (max-width: 600px) {
            header { padding-bottom: 100px; }
            .top-bar { margin-bottom: 34px; }
            .top-bar img { height: 28px; }
            .top-actions { gap: 8px; }
            .sign-out { padding: 8px 13px; gap: 6px; font-size: 0.85rem; }
            .main-card { padding: 24px 20px 20px 20px; }
            .main-card h2 { font-size: 1.45rem; }
            .details li { flex-direction: column; gap: 2px; }
            .details .v { text-align: left; }
        }
        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; transition: none; }
            .spinner { animation-duration: 2.4s; }
        }

        /* --- Settings rows --- */
        .setting-list { list-style: none; margin-top: 6px; }
        .setting-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 4px;
            border-top: 1px solid rgba(78, 81, 62, 0.15);
        }
        /* (the line under the last row is on the list, so it stays put when a row is hidden) */
        .setting-list { border-bottom: 1px solid rgba(78, 81, 62, 0.15); }
        .setting-value .sv-line { display: block; white-space: nowrap; }
        .setting-value .sv-line + .sv-line { opacity: 0.75; font-size: 0.92em; }
        .setting-row[hidden] { display: none; }
        .setting-label { font-weight: bold; flex: 0 1 auto; }
        .setting-value { flex: 1; min-width: 0; text-align: right; overflow-wrap: anywhere; }
        .setting-value.is-empty { font-style: italic; opacity: 0.6; }
        .edit-btn {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--navy);
            border-radius: 50%;
            background: var(--white);
            color: var(--olive);
            cursor: pointer;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }
        .edit-btn svg { width: 17px; height: 17px; }
        .edit-btn:disabled { opacity: 0.4; cursor: default; }
        @media (hover: hover) { .edit-btn:not(:disabled):hover { background: var(--olive); color: var(--cream); transform: translateY(-2px); } }
        /* Nothing on file yet: the pencil becomes a "Start" pill */
        .edit-btn.is-start {
            width: auto;
            gap: 6px;
            padding: 0 14px 0 16px;
            border-radius: 999px;
            background: var(--tan);
            color: var(--cream);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .edit-btn.is-start svg { width: 15px; height: 15px; }
        @media (hover: hover) { .edit-btn.is-start:not(:disabled):hover { background: var(--rust); color: var(--cream); } }
        .page-message { min-height: 1.4em; margin: 14px 4px 0 4px; font-size: 0.95rem; font-weight: bold; }
        .page-message:empty { min-height: 0; margin: 0; }
        .page-message.is-error { color: var(--rust); }
        .page-message.is-success { color: var(--olive); }

        /* --- Edit pop-up (centered card on desktop, slides up from the bottom on phones) --- */
        .edit-dialog {
            margin: auto;
            width: calc(100% - 40px);
            max-width: 480px;
            padding: 0;
            border: 2px solid var(--navy);
            border-radius: 24px;
            box-shadow: 6px 6px 0px var(--navy);
            background: var(--white);
            color: var(--brown);
            overflow: visible;
        }
        .edit-dialog::backdrop { background: rgba(14, 42, 59, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
        .edit-dialog[open] { animation: dialogIn 0.4s var(--ease); }
        .edit-dialog[open]::backdrop { animation: fadeIn 0.3s ease; }
        @keyframes dialogIn { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .dialog-inner { padding: 28px 28px 24px 28px; }
        .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
        .dialog-head h2 { font-size: 1.6rem; line-height: 1.15; }
        .close-btn {
            flex: 0 0 auto;
            width: 40px;
            height: 40px;
            margin: -4px -6px 0 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: #f2ede6;
            color: var(--brown);
            cursor: pointer;
        }
        .close-btn svg { width: 18px; height: 18px; }
        .muted { opacity: 0.75; font-size: 0.95rem; margin-bottom: 18px; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .field label { display: block; font-size: 0.9rem; font-weight: bold; margin: 0 0 8px 6px; }
        .field input {
            width: 100%;
            min-height: 54px;
            padding: 12px 20px;
            border: 2px solid var(--navy);
            border-radius: 999px;
            background: #f7f4f0;
            font-family: inherit;
            font-size: 1.05rem;
            color: var(--brown);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .field input:focus { outline: none; background: var(--white); border-color: var(--tan); box-shadow: 0 0 0 4px rgba(192, 144, 80, 0.22); }
        .form-message { min-height: 1.4em; margin: 12px 4px 0 4px; font-size: 0.92rem; font-weight: bold; color: var(--rust); }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
        button.btn { font-family: inherit; font-size: 1rem; cursor: pointer; gap: 8px; }
        button.btn:disabled { opacity: 0.65; cursor: wait; transform: none; }
        .btn-secondary { background: var(--white); color: var(--brown); }
        @media (hover: hover) { .btn-secondary:hover { background: #f2ede6; } }
        .btn .btn-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid rgba(233, 226, 216, 0.35);
            border-top-color: var(--cream);
            animation: spin 0.8s linear infinite;
        }
        .btn.is-loading .btn-spinner { display: inline-block; }

        @media (max-width: 600px) {
            /* Phones: label on top, value(s) underneath, pencil on the right */
            .setting-row { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; row-gap: 3px; padding: 14px 0; }
            .setting-label { grid-column: 1; }
            .setting-value { grid-column: 1; text-align: left; opacity: 0.85; }
            .setting-row .edit-btn { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
            .setting-label { font-size: 0.95rem; }
            .edit-btn { width: 36px; height: 36px; }
            /* The Start button already says nothing is on file, so skip the "Not added yet" text on phones */
            .setting-value.is-empty { visibility: hidden; }
            .edit-dialog {
                width: 100%;
                max-width: none;
                margin: auto 0 0 0;
                border-radius: 24px 24px 0 0;
                border-bottom: none;
                box-shadow: none;
            }
            .edit-dialog[open] { animation: sheetIn 0.42s var(--ease); }
            @keyframes sheetIn { from { transform: translateY(100%); } to { transform: none; } }
            .dialog-inner { padding: 24px 20px calc(env(safe-area-inset-bottom, 0px) + 20px) 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-actions { flex-direction: column-reverse; }
            .form-actions .btn { width: 100%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .edit-dialog[open], .edit-dialog[open]::backdrop { animation: none; }
        }

        /* --- Flip portal: fullscreen map, no page scrolling --- */
        html:has(body.flip-page), body.flip-page { height: 100%; overflow: hidden; overscroll-behavior: none; }
        body.flip-page { display: flex; flex-direction: column; height: 100dvh; background: var(--cream); }
        .flip-header {
            position: relative;
            z-index: 45;
            flex: 0 0 auto;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px 16px;
            overflow: visible;
            background: var(--olive);
            color: var(--cream);
            text-align: left;
        }
        .flip-header .flip-back { justify-self: start; }
        .flip-logo { justify-self: center; display: block; }
        .flip-logo img { display: block; height: 32px; width: auto; }
        .flip-menu-btn { justify-self: end; display: none; }
        .flip-header .sign-out { background: rgba(14, 42, 59, 0.2); backdrop-filter: none; -webkit-backdrop-filter: none; }
        .flip-menu-btn svg { width: 20px; height: 20px; }
        .flip-body { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
        .map-wrap { touch-action: none; }
        .map-wrap { position: relative; flex: 1 1 auto; min-width: 0; background: #ece6dc; }
        #map { position: absolute; inset: 0; }
        .map-message { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-weight: bold; opacity: 0.8; }
        .map-message[hidden] { display: none; }

        /* Properties list: always open on the right on desktop */
        .prop-panel { flex: 0 0 380px; display: flex; flex-direction: column; min-height: 0; border-left: 2px solid var(--navy); background: var(--white); }

        // "123 Main St #4, Mesa, AZ 85201" as two lines: the street, then the city, state and zip
        function addressLines(address) {
            const parts = known(address).split(', ');
            if (parts.length < 2) return [parts[0] || '', ''];
            const keep = parts.length >= 3 ? 2 : 1;
            return [parts.slice(0, -keep).join(', '), parts.slice(-keep).join(', ')];

        const addressHtml = address => {
            const [street, place] = addressLines(address);

        };

        // Accounts without FLIPPER BUYER (the server decides) get a blank page with just this line

            const note = document.createElement('p');

            note.textContent = 'You do not have access to this page.';
            document.body.append(note);
            document.body.classList.add('no-access');
        }

        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.hidden = false;
        }

        // --- Google Maps (loaded once) ---
        function loadMaps() {
            return new Promise((resolve, reject) => {
                if (window.google && google.maps && google.maps.importLibrary) { resolve(); return; }
                window.__flipMapsReady = () => resolve();
                const script = document.createElement('script');
                script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(GOOGLE_MAPS_API_KEY) + '&loading=async&v=weekly&callback=__flipMapsReady';
                script.async = true;
                script.onerror = () => reject(new Error('maps_failed'));
                document.head.append(script);
            });
        }

        let currentUser = null;
        async function api(payload) {
            const idToken = await currentUser.getIdToken();
            return fetch(PORTAL_API_URL, {
                method: 'POST',

                body: JSON.stringify({ idToken, ...payload }),

        }

        // --- Pictures ---
        const photosEl = document.getElementById('sheet-photos');
        const stripEl = document.getElementById('photo-strip');
        const photoCountEl = document.getElementById('photo-count');
        const photoLists = {};   // row -> promise of [{ id }]
        const photoData = {};    // id -> promise of a data URL
        let photoToken = 0;
        let photoObserver = null;
        const listPhotos = row => photoLists[row] || (photoLists[row] = api({ action: 'wholesalePhotos', row })
            .then(j => { if (!j.ok) throw new Error(j.error); return j.photos || []; })
            .catch(err => { delete photoLists[row]; throw err; }));
        const photoUrl = (row, id) => photoData[id] || (photoData[id] = api({ action: 'wholesalePhoto', row, id })
            .then(j => { if (!j.ok) throw new Error(j.error); return 'data:' + j.type + ';base64,' + j.data; })
            .catch(err => { delete photoData[id]; throw err; }));
        function loadSlide(slide) {
            if (!slide.loading) {
                slide.loading = photoUrl(slide.dataset.row, slide.dataset.id).then(url => {
                    const img = slide.querySelector('img');
                    img.onload = () => { img.classList.add('is-loaded'); slide.classList.add('is-loaded'); };
                    img.src = url;
                }).catch(err => { console.error(err); slide.classList.add('is-failed'); });
            }
            return slide.loading;
        }
        // The rest of an open property's pictures, in order, two at a time (stops when another property opens)
        function preloadSlides(token) {
            const slides = [...stripEl.children].filter(el => el.dataset.id);
            let next = 0;
            const worker = async () => {
                while (token === photoToken && next < slides.length) await loadSlide(slides[next++]);
            };
            worker();
            worker();
        }
        function updatePhotoCount() {
            const slides = stripEl.children;
            if (slides.length < 2) { photoCountEl.textContent = ''; return; }
            const index = Math.round(stripEl.scrollLeft / (slides[0].offsetWidth + 8));
            photoCountEl.textContent = Math.min(index + 1, slides.length) + ' / ' + slides.length;
            photosEl.querySelector('.is-prev').disabled = index <= 0;
            photosEl.querySelector('.is-next').disabled = index >= slides.length - 1;
        }
        stripEl.addEventListener('scroll', updatePhotoCount, { passive: true });
        photosEl.querySelectorAll('[data-photo-step]').forEach(btn => btn.addEventListener('click', () => {
            const first = stripEl.children[0];
            if (first) stripEl.scrollBy({ left: Number(btn.dataset.photoStep) * (first.offsetWidth + 8), behavior: 'smooth' });
        }));
        const PHOTO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>';
        function showNoPhotos() {
            stripEl.innerHTML = '<div class="photo-slide is-empty">' + PHOTO_ICON + '<span>Photos not yet available.</span></div>';
            photosEl.classList.remove('has-many');
            photoCountEl.textContent = '';
        }
        async function showPhotos(p) {
            const token = ++photoToken;
            if (photoObserver) photoObserver.disconnect();
            stripEl.innerHTML = '';
            stripEl.scrollLeft = 0;
            photoCountEl.textContent = '';
            photosEl.classList.remove('has-many');
            photosEl.hidden = false;
            if (!p.photos) { showNoPhotos(); return; }
            // A placeholder while the list loads
            photosEl.hidden = false;
            stripEl.innerHTML = '<div class="photo-slide"></div>';
            let photos;
            try { photos = await listPhotos(p.row); } catch (err) { console.error(err); photos = []; }
            if (token !== photoToken) return;
            if (!photos.length) { showNoPhotos(); return; }
            stripEl.innerHTML = photos.map((ph, i) => '<div class="photo-slide" data-row="' + p.row + '" data-id="' + escapeHtml(ph.id) + '" role="button" tabindex="0" aria-label="Open picture ' + (i + 1) + ' fullscreen">'
                + '<img alt="Picture ' + (i + 1) + ' of ' + photos.length + '" decoding="async"></div>').join('');
            photosEl.classList.toggle('has-many', photos.length > 1);

            photoObserver = new IntersectionObserver(entries => entries.forEach(entry => {
                if (!entry.isIntersecting) return;

        // --- Fullscreen pictures ---
        const lightbox = document.getElementById('lightbox');
        const lbStrip = document.getElementById('lb-strip');

        const lbIndex = () => Math.round(lbStrip.scrollLeft / Math.max(1, lbStrip.clientWidth));
        function updateLbCount() {
            const total = lbStrip.children.length;

        function openLightbox(startIndex, opener) {
            const slides = [...stripEl.children].filter(el => el.dataset.id);
            if (!slides.length) return;

            // The same pictures the swipe-up loaded (still-loading ones fill in when they arrive)

                const target = lbStrip.children[i];

                    const src = sl.querySelector('img').src;
                    if (!src) { target.classList.remove('is-waiting'); target.classList.add('is-failed'); return; }
                    const img = target.querySelector('img');
                    img.onload = () => { img.classList.add('is-loaded'); target.classList.remove('is-waiting'); };
                    img.src = src;
                };

            requestAnimationFrame(() => {
                lbStrip.scrollTo({ left: startIndex * lbStrip.clientWidth, behavior: 'instant' });
                updateLbCount();
                document.getElementById('lb-close').focus({ preventScroll: true });
            });
        }
        function closeLightbox() {
            const index = lbIndex();
            lightbox.hidden = true;
            lbStrip.innerHTML = '';

            const first = stripEl.children[0];
            if (first) stripEl.scrollTo({ left: index * (first.offsetWidth + 8), behavior: 'instant' });
            if (lbOpener) lbOpener.focus({ preventScroll: true });
        }
        lbStrip.addEventListener('scroll', updateLbCount, { passive: true });
        document.getElementById('lb-close').addEventListener('click', closeLightbox);
        lightbox.querySelectorAll('[data-lb-step]').forEach(btn => btn.addEventListener('click', () => {
            lbStrip.scrollBy({ left: Number(btn.dataset.lbStep) * lbStrip.clientWidth, behavior: 'smooth' });
        }));
        // Tapping the dark area around a picture closes it
        lbStrip.addEventListener('click', e => { if (e.target.classList.contains('lb-slide')) closeLightbox(); });
        // While it's open, the keyboard belongs to it
        window.addEventListener('keydown', e => {
            if (lightbox.hidden) return;

            else return;
            e.preventDefault();
            e.stopPropagation();
        }, true);
        stripEl.addEventListener('click', e => {
            const slide = e.target.closest('.photo-slide[data-id]');
            if (!slide) return;
            const slides = [...stripEl.children].filter(el => el.dataset.id);
            openLightbox(slides.indexOf(slide), slide);
        });

        // --- Swipe-up details ---
        const sheet = document.getElementById('prop-sheet');
        let activePin = null;
        function openSheet(p, pin) {
            if (activePin) activePin.classList.remove('is-active');
            activePin = pin;
            if (pin) pin.classList.add('is-active');
            document.querySelectorAll('.prop-item.is-active').forEach(el => el.classList.remove('is-active'));
            const item = document.querySelector('.prop-item[data-row="' + p.row + '"]');
            if (item) item.classList.add('is-active');
            const row = (label, value, html) => {
                const v = known(value);
                return '<li><span class="k">' + label + '</span><span class="v' + (v ? '' : ' is-unknown') + '">' + (v && html ? html : escapeHtml(v || 'Unknown')) + '</span></li>';
            };
            const price = p.price === null || p.price === undefined ? '' : dollars.format(p.price);
            document.getElementById('sheet-title').innerHTML = addressHtml(p.address);
            document.getElementById('sheet-price').textContent = price || 'Price Unknown';
            showPhotos(p);
            // "3 bd • 2 ba • 1,500 sqft" (only the parts the sheet has; Unknown when it has none)
            const size = [known(p.bed) && known(p.bed) + ' bd', known(p.bath) && known(p.bath) + ' ba', known(p.sqft) && sqftText(p.sqft) + ' sqft'].filter(Boolean).join(' • ');
            document.getElementById('sheet-details').innerHTML = row('Price', price) + row('Size', size) + row('Property Type', p.type);
            renderSends(p);
            sheet.scrollTop = 0;
            sheet.style.transform = '';

        }
        stripEl.addEventListener('keydown', e => {
            const slide = e.target.closest('.photo-slide[data-id]');
            if (!slide || (e.key !== 'Enter' && e.key !== ' ')) return;
            e.preventDefault();
            slide.click();
        });
        // Admins: who sent this property and when, newest first (their price, before markup). Only admins get this data.
        function renderSends(p) {
            const box = document.getElementById('sheet-admin');
            if (!Array.isArray(p.sends)) { box.hidden = true; return; }
            const part = (v, cls, fallback) => '<span class="' + cls + (known(v) ? '' : ' is-unknown') + '">' + escapeHtml(known(v) || fallback) + '</span>';
            document.getElementById('send-list').innerHTML = p.sends.map(x => {
                const when = dateOf(x.date);
                const date = when ? when.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
                const price = x.price === null || x.price === undefined ? '' : dollars.format(x.price);
                return '<li><span class="send-who">' + part(x.company, 'send-main', 'Unknown') + part(x.individual, 'send-sub', 'Unknown') + '</span>'
                    + '<span class="send-what">' + part(price, 'send-main', 'Unknown') + part(date, 'send-sub', 'Unknown') + '</span></li>';
            }).join('');

        }
        function closeSheet() {
            if (!lightbox.hidden) closeLightbox();

        }

        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;

            else if (panel.classList.contains('is-open')) closeMenu();
        });

        // --- Properties list (desktop panel / mobile menu) ---
        const panel = document.getElementById('prop-panel');
        const scrim = document.getElementById('panel-scrim');
        const menuBtn = document.getElementById('menu-btn');
        const listEl = document.getElementById('prop-list');
        const isMobile = () => window.matchMedia('(max-width: 899px)').matches;
        let menuOpened = false;
        function openMenu() {
            if (!menuOpened) { menuOpened = true; setTimeout(pumpCovers, 300); }
            panel.classList.add('is-open');
            scrim.classList.add('is-open');
            menuBtn.setAttribute('aria-expanded', 'true');
            if (sheet.classList.contains('is-open')) closeSheet();
            const first = panel.querySelector('.prop-item.is-active, .prop-item');
            if (first) first.focus({ preventScroll: true });
        }
        function closeMenu() {
            panel.classList.remove('is-open');
            scrim.classList.remove('is-open');
            menuBtn.setAttribute('aria-expanded', 'false');
        }
        menuBtn.addEventListener('click', () => (panel.classList.contains('is-open') ? closeMenu() : openMenu()));
        document.getElementById('panel-close').addEventListener('click', () => { closeMenu(); menuBtn.focus(); });
        scrim.addEventListener('click', closeMenu);

        let listed = [];
        let mapRef = null;
        // Newest DATE SENT first (rows without a date last; on the same date, the lower row is newer)
        function renderList(properties) {
            listed = properties
                .map(p => ({ p, when: dateOf(p.date) }))
                .sort((a, b) => ((b.when ? b.when.getTime() : -Infinity) - (a.when ? a.when.getTime() : -Infinity)) || (b.p.row - a.p.row))
                .map(x => x.p);
            if (!listed.length) { listEl.innerHTML = '<li class="prop-empty">No wholesale properties right now.</li>'; return; }
            listEl.innerHTML = listed.map(p => {
                const when = dateOf(p.date);
                const meta = [known(p.bed) && known(p.bed) + ' bd', known(p.bath) && known(p.bath) + ' ba', known(p.sqft) && sqftText(p.sqft) + ' sqft', known(p.type)].filter(Boolean).join(' · ');
                const hasPrice = p.price !== null && p.price !== undefined;
                return '<li><button type="button" class="prop-item" data-row="' + p.row + '">'
                    + '<span class="prop-cover' + (p.photos ? '' : ' is-empty') + '" data-cover="' + p.row + '">' + (p.photos ? '<img alt="">' : PHOTO_ICON) + '</span>'
                    + '<span class="prop-item-body"><span class="prop-item-top"><span class="prop-item-price' + (hasPrice ? '' : ' is-unknown') + '">' + (hasPrice ? dollars.format(p.price) : 'Price Unknown') + '</span>'
                    + (when ? '<span class="prop-item-date">' + when.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + '</span>' : '') + '</span>'
                    + '<span class="prop-item-address">' + addressHtml(p.address) + '</span>'
                    + (meta ? '<span class="prop-item-meta">' + escapeHtml(meta) + '</span>' : '')
                    + '</span></button></li>';
            }).join('');
            watchCovers();
        }

        // Covers load in batches of 8: the rows on screen first, then every other row in the background
        const coverQueue = [];
        const coverBackground = [];
        let batchesLoading = 0;
        let coverObserver = null;
        function emptyCover(box) {
            box.classList.add('is-empty');
            box.innerHTML = PHOTO_ICON;
        }
        function showCover(box, cover) {
            if (!cover || cover.none || cover.error) { emptyCover(box); return; }

            img.onload = () => box.classList.add('is-loaded');
            img.src = 'data:' + cover.type + ';base64,' + cover.data;
        }
        function nextCovers() {
            const batch = [];
            while (batch.length < 8 && (coverQueue.length || coverBackground.length)) {
                const box = coverQueue.length ? coverQueue.shift() : coverBackground.shift();
                if (box.dataset.started || !box.isConnected) continue;

        }
        listEl.addEventListener('click', e => {
            const btn = e.target.closest('.prop-item');
            if (!btn) return;
            const p = listed.find(x => String(x.row) === btn.dataset.row);
            if (!p) return;
            if (isMobile()) closeMenu();
            openSheet(p, p.pinEl || null);
            if (mapRef && p.lat !== null && p.lng !== null) {
                if (mapRef.getZoom() < 13) mapRef.setZoom(13);
                mapRef.setCenter({ lat: p.lat, lng: p.lng });
                // Nudge the pin up into the open space above the swipe-up
                const mapHeight = document.querySelector('.map-wrap').offsetHeight;
                mapRef.panBy(0, Math.max(0, Math.round(Math.min(sheet.offsetHeight, mapHeight * 0.75) / 2)));
            }
        });
        // Drag the top of the sheet down to close it
        (() => {
            let startY = null;
            let moved = 0;
            const grab = e => {
                if (e.target.closest('button')) return;
                startY = e.clientY;
                moved = 0;
                sheet.classList.add('is-dragging');
                try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* already released */ }
            };

                if (startY === null) return;

                if (startY === null) return;

            });

        // --- Map and pins ---
        async function drawMap(properties) {
            await loadMaps();
            const { Map, OverlayView } = await google.maps.importLibrary('maps');
            const { LatLng, LatLngBounds } = await google.maps.importLibrary('core');
            const placed = properties.filter(p => p.lat !== null && p.lng !== null);
            const map = new Map(mapEl, {
                center: { lat: 33.4484, lng: -112.074 },
                zoom: 10,
                clickableIcons: false,
                streetViewControl: false,
                mapTypeControl: false,
                fullscreenControl: false,
                gestureHandling: 'greedy',
                styles: [
                    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
                    { featureType: 'transit', stylers: [{ visibility: 'off' }] },
                ],
            });
            mapRef = map;

            // Every price pill in one layer on the map's top pane. They stay real, focusable buttons.
            class PinLayer extends OverlayView {
                constructor(items) {
                    super();
                    this.items = items;
                    this.div = document.createElement('div');
                    this.div.className = 'pin-layer';
                    items.forEach(it => this.div.append(it.el));
                }
                onAdd() { this.getPanes().floatPane.append(this.div); }
                draw() {
                    const projection = this.getProjection();
                    if (!projection) return;
                    const width = mapEl.offsetWidth;
                    const height = mapEl.offsetHeight;
                    for (const it of this.items) {
                        const point = projection.fromLatLngToDivPixel(it.position);
                        const screen = projection.fromLatLngToContainerPixel(it.position);
                        // Off-screen pins (with a margin) are hidden, so only the visible ones move each frame
                        const off = !point || !screen || screen.x < -120 || screen.x > width + 120 || screen.y < -60 || screen.y > height + 80;
                        if (it.el.hidden !== off) it.el.hidden = off;
                        if (off) continue;
                        it.el.style.transform = 'translate3d(' + Math.round(point.x) + 'px,' + Math.round(point.y) + 'px,0) translate(-50%, calc(-100% - 7px))';
                    }
                }
                onRemove() { this.div.remove(); }
            }
            const items = placed.map(p => {
                const el = document.createElement('button');
                el.type = 'button';
                el.className = 'price-pin';
                el.textContent = shortPrice(p.price);
                el.setAttribute('aria-label', (p.address || 'Property') + ', ' + (p.price === null ? 'price unknown' : dollars.format(p.price)));
                // Keyboard (Enter/Space); taps and clicks are detected below
                el.addEventListener('click', e => { e.stopPropagation(); if (e.detail === 0) openSheet(p, el); });
                el.dataset.row = p.row;
                p.pinEl = el;
                return { el, p, position: new LatLng(p.lat, p.lng) };
            });
            const layer = new PinLayer(items);
            // Pin row -> property ("Map" here is Google's map class, so a plain object)
            const byRow = {};
            items.forEach(it => { byRow[it.p.row] = it.p; });
            // Touches and clicks on a pin still reach the map (so pinching and dragging from a pin move the map);
            // a short press that barely moves is a tap on that pin
            let press = null;
            let pinTapAt = 0;
            layer.div.addEventListener('pointerdown', e => {
                const el = e.target.closest('.price-pin');
                press = el && e.isPrimary ? { el, x: e.clientX, y: e.clientY, at: Date.now() } : null;
            });
            document.addEventListener('pointerdown', e => { if (!e.isPrimary) press = null; }, true); // a second finger: a pinch
            document.addEventListener('pointercancel', () => { press = null; }, true);
            document.addEventListener('pointerup', e => {
                if (!press || !e.isPrimary) return;
                const { el, x, y, at } = press;
                press = null;
                if (Math.hypot(e.clientX - x, e.clientY - y) > 10 || Date.now() - at > 600) return;
                const p = byRow[el.dataset.row];
                if (!p) return;
                pinTapAt = Date.now();
                openSheet(p, el);
            }, true);
            // A tap on empty map closes the details (the map also sees taps on pins, so those are skipped)
            map.addListener('click', () => { if (Date.now() - pinTapAt > 500 && sheet.classList.contains('is-open')) closeSheet(); });

            const bounds = new LatLngBounds();
            placed.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
            layer.setMap(map);
            if (placed.length === 1) { map.setCenter(bounds.getCenter()); map.setZoom(14); }
            else if (placed.length > 1) map.fitBounds(bounds, 48);
            messageEl.hidden = true;
            if (!properties.length) showMessage('No wholesale properties right now. Check back soon.');
        }

        async function load(user) {
            currentUser = user;
            if (!PORTAL_API_URL) { showMessage('The map isn’t available yet.'); return; }
            try {
                const data = await api({ action: 'wholesaleProperties' });
                if (!data.ok) {
                    if (data.error === 'not_allowed' || data.error === 'not_found') { showNoAccess(); return; }
                    throw new Error(data.error || 'Request failed');
                }
                const properties = data.properties || [];
                if (data.geoError) console.warn('Map positions: the geocoder said', data.geoError);
                countEl.textContent = properties.length === 1 ? '1 property' : properties.length + ' properties';
                renderList(properties);
                const waiting = properties.filter(p => p.lat === null && !p.located).length;
                const missing = properties.filter(p => p.lat === null && p.located).length;
                const notes = [];
                if (waiting) notes.push(waiting + (waiting === 1 ? ' property is' : ' properties are') + ' still being placed on the map. Refresh in a minute to see ' + (waiting === 1 ? 'it' : 'them') + '.');
                if (missing) notes.push(missing + (missing === 1 ? ' address' : ' addresses') + ' couldn’t be found on the map.');
                noteEl.textContent = notes.join(' ');
                try {
                    await drawMap(properties);
                } catch (err) {
                    console.error(err);
                    showMessage('We couldn’t load the map. Please refresh to try again.');
                }
            } catch (err) {
                console.error(err);
                showMessage('We couldn’t load the properties. Please refresh to try again.');
            }
        }

        function initReveal() {
            const items = document.querySelectorAll('.reveal');
            if (!('IntersectionObserver' in window)) { items.forEach(el => el.classList.add('is-visible')); return; }
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('is-visible'); observer.unobserve(entry.target); }
                });
            }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
            items.forEach(el => observer.observe(el));
        }

        if (!isConfigured) {
            location.replace('/login');
        } else {
            const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
            const { getAuth, onAuthStateChanged } = await import(`${FIREBASE_SDK}/firebase-auth.js`);
            const auth = getAuth(initializeApp(firebaseConfig));

            onAuthStateChanged(auth, user => {
                // Not signed in: send them to the login page (and back here afterwards)
                if (!user) { location.replace('/login?next=' + encodeURIComponent(location.pathname + location.search)); return; }
                // Stay on the loading screen until the map is in, with a time limit
                const timeLimit = new Promise(resolve => setTimeout(resolve, 30000));
                Promise.race([load(user), timeLimit]).then(() => {
                    document.body.classList.remove('is-checking');
                    initReveal();
                });
            });

        }
    </script>
</body>
</html>
